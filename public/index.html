  <script>
    (function () {
      var revealed = false;
      function reveal() {
        if (revealed) return;
        revealed = true;
        if (document.body) document.body.style.opacity = '1';
      }
      function waitUntilStyled() {
        var probe = document.createElement('div');
        probe.className = 'bg-[#5851f6]';
        probe.style.position = 'fixed';
        probe.style.left = '-9999px';
        document.body.appendChild(probe);

        var start = Date.now();
        var fontDone = false;
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { fontDone = true; });
        } else {
          fontDone = true;
        }

        function check() {
          if (revealed) return;
          var twReady = getComputedStyle(probe).backgroundColor === 'rgb(88, 81, 246)';
          var rootEl = document.getElementById('root');
          var rootReady = !rootEl || rootEl.children.length > 0;
          var elapsed = Date.now() - start;

          if ((twReady && rootReady && (fontDone || elapsed > 450)) || elapsed > 1800) {
            if (probe.parentNode) probe.parentNode.removeChild(probe);
            requestAnimationFrame(reveal);
          } else {
            requestAnimationFrame(check);
          }
        }
        requestAnimationFrame(check);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitUntilStyled);
      } else {
        waitUntilStyled();
      }
      setTimeout(reveal, 2000);
    })();
  </script>

        try {
          const r = await fetch(`/api/inquiries/mine?save_code=${encodeURIComponent(curProf.save_code || '')}&nickname=${encodeURIComponent(curProf.nickname || '')}&t=${Date.now()}`, { cache: 'no-store' });

          if (d && d.ok) setMyInquiries(Array.isArray(d.inquiries) ? d.inquiries : []);
        } catch (_) {}
      };

      const handleSubmitInquiry = async () => {
        const curProf = profile || window.ArcadeAuth?.getProfile?.();
        if (!curProf) return;
        if (!inqTitle.trim() || !inqContent.trim()) {
          showToast('문의 제목과 내용을 모두 입력해주세요.');

        setInqSubmitting(true);
        try {
          const r = await fetch('/api/inquiries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              save_code: curProf.save_code,
              nickname: curProf.nickname,
              category: inqCategory,
              title: inqTitle.trim(),
              content: inqContent.trim()

          });
          const d = await r.json();
          if (d && d.ok) {
            setInqTitle('');
            setInqContent('');
            showToast(d.message || '문의가 접수되었습니다!');

            method: 'POST',
            headers: getAdminHeaders({ 'Content-Type': 'application/json' }),

          if (d && d.ok) {
            showToast(d.message || '답변이 등록되었습니다!');

                    disabled={inqSubmitting}
                    onClick={handleSubmitInquiry}
                    className="w-full py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 disabled:opacity-50 text-slate-950 font-black text-xs transition"
                  >
                    {inqSubmitting ? '접수 중...' : '📩 문의 접수하기'}
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  <div className="text-[11px] font-black text-slate-400">내 문의 내역 ({myInquiries.length}건)</div>
                  {myInquiries.length === 0 ? (
                    <div className="text-center text-xs text-slate-500 py-6 bg-[#080c17] rounded-2xl border border-[#1f2942]">
                      접수한 문의 내역이 없습니다.
                    </div>
                  ) : (
                    myInquiries.map((q) => (
                      <div key={q.id} className="p-3 rounded-2xl bg-[#080c17] border border-[#1f2942] space-y-1.5">
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex items-center gap-1.5 min-w-0">
                            <span className={`px-1.5 py-0.5 rounded text-[9px] font-black shrink-0 ${q.status === 'ANSWERED' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-200'}`}>
                              {q.status === 'ANSWERED' ? '✅ 답변완료' : '⏳ 답변대기'}
                            </span>
                            <span className="text-[10px] font-black text-sky-300 shrink-0">[{q.category}]</span>
                            <span className="text-xs font-black text-white truncate">{q.title}</span>
                          </div>
                          <span className="text-[9px] text-slate-500 shrink-0">
                            {q.createdAt ? new Date(q.createdAt).toLocaleDateString('ko-KR') : ''}
                          </span>
                        </div>
                        <p className="text-[11px] text-slate-300 whitespace-pre-wrap">{q.content}</p>
                        {q.answer && (
                          <div className="mt-1.5 p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-400/35 text-[11px] text-emerald-100 whitespace-pre-wrap">
                            <div className="text-[10px] font-black text-emerald-300 mb-0.5">💬 관리자 답변 ({q.answeredBy || '관리자'})</div>
                            {q.answer}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>

                <button
                  type="button"
                  onClick={() => setShowInquiryModal(false)}
                  className="w-full py-2.5 rounded-xl bg-[#252d3d] hover:bg-[#303a4f] text-white font-extrabold text-xs shrink-0"
                >
                  닫기
                </button>
              </div>
            </div>
          )}

          {/* ================= [☁️ 연동] 세이브 코드 불러오기 모달 ================= */}
          {showSyncModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center px-4">
              <div className="w-full max-w-[380px] bg-[#131829] border border-[#242e4c] rounded-[24px] p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-white">☁️ 기기 연동 (코드 불러오기)</h3>
                  <button
                    type="button"
                    onClick={() => setShowSyncModal(false)}
                    className="text-slate-400 hover:text-white text-lg font-black"
                  >
                    ×
                  </button>
                </div>

                <form onSubmit={handleLoadByCode} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">
                      8자리 세이브 코드 입력
                    </label>
                    <input
                      type="text"
                      maxLength={8}
                      value={syncCodeInput}
                      onChange={(e) => setSyncCodeInput(e.target.value.toUpperCase())}
                      placeholder="예: A3F9K2X1"
                      className="w-full uppercase bg-[#060913] border border-[#4c49b8] focus:border-[#635bff] rounded-xl px-4 py-3 text-center font-mono text-base font-black tracking-widest text-white placeholder-slate-600 outline-none"
                    />
                    {syncError && <p className="text-xs font-bold text-rose-400 text-center mt-1.5">{syncError}</p>}
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowSyncModal(false)}
                      className="py-3 rounded-xl bg-[#252d3d] text-slate-200 font-extrabold text-xs sm:text-sm"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="py-3 rounded-xl bg-[#5851f6] text-white font-extrabold text-xs sm:text-sm shadow-lg"
                    >
                      불러오기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= 관리자: 유저 상세 정보 수정 모달 (닉네임·연동번호·스타·전적) ================= */}
          {editingUser && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center px-4">
              <div className="w-full max-w-[440px] bg-[#131829] border border-[#2b3861] rounded-[24px] p-5 sm:p-6 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-white">✏️ 계정 정보 수정 ({editingUser.nickname})</h3>
                  <button
                    type="button"
                    onClick={() => setEditingUser(null)}
                    className="text-slate-400 hover:text-white text-xl font-black"
                  >
                    ×
                  </button>
                </div>

                <form onSubmit={handleSaveUserAsAdmin} className="space-y-3.5 text-xs">
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">👤 닉네임 (아이디)</label>
                      <input
                        type="text"
                        maxLength={16}
                        value={editForm.nickname}
                        onChange={(e) => setEditForm((p) => ({ ...p, nickname: e.target.value }))}
                        className="w-full bg-[#080c17] border border-[#232f52] rounded-xl px-3 py-2 font-black text-white outline-none focus:border-cyan-400"
                      />
                    </div>
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="font-bold text-slate-300">🔑 연동번호 (8자리)</label>
                        <button
                          type="button"
                          onClick={generateRandomCode8ForEdit}
                          className="text-[10px] font-extrabold text-cyan-300 underline"
                        >
                          랜덤생성
                        </button>
                      </div>
                      <input
                        type="text"
                        maxLength={8}
                        value={editForm.save_code}
                        onChange={(e) => setEditForm((p) => ({ ...p, save_code: e.target.value.toUpperCase() }))}
                        className="w-full uppercase font-mono bg-[#080c17] border border-[#232f52] rounded-xl px-3 py-2 font-black text-amber-300 outline-none focus:border-cyan-400"
                      />
                    </div>
                  </div>

                  <div className="p-3 rounded-2xl bg-[#080c17] border border-[#232f52] space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="font-extrabold text-amber-300">⭐ 보유 스타 (스타)</label>
                      <span className="text-[11px] font-black text-slate-300">현재: {Number(editForm.gold || 0).toLocaleString()} 스타</span>
                    </div>
                    <input
                      type="number"
                      min={0}
                      step={1}
                      value={editForm.gold}
                      onChange={(e) => setEditForm((p) => ({ ...p, gold: Math.max(0, Number(e.target.value) || 0) }))}
                      className="w-full bg-[#111625] border border-[#1f2942] rounded-xl px-3 py-2 text-sm font-black text-amber-300 outline-none focus:border-amber-400"
                    />
                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5 pt-1">
                      {[
                        { label: '+1만', delta: 10000 },
                        { label: '+10만', delta: 100000 },
                        { label: '+100만', delta: 1000000 },
                        { label: '+1000만', delta: 10000000 },
                        { label: '+1억', delta: 100000000 },
                        { label: '0 초기화', delta: null }
                      ].map((b) => (
                        <button
                          key={b.label}
                          type="button"
                          onClick={() =>
                            setEditForm((p) => ({
                              ...p,
                              gold: b.delta === null ? 0 : Math.max(0, (Number(p.gold) || 0) + b.delta)
                            }))
                          }
                          className={`py-1.5 rounded-lg font-black text-[10px] border ${
                            b.delta === null
                              ? 'bg-rose-500/20 border-rose-500/40 text-rose-300'
                              : 'bg-amber-500/15 border-amber-400/40 text-amber-200 hover:bg-amber-500/25'
                          }`}
                        >
                          {b.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <label className="p-3 rounded-2xl bg-[#080c17] border border-[#232f52] flex items-center justify-between gap-2 cursor-pointer">
                    <div>
                      <div className="font-extrabold text-rose-300">🔞 성인 인증 (19+)</div>
                      <div className="text-[10px] text-slate-400">체크 시 로얄 경마 · 로얄 블랙잭 탭이 노출됩니다.</div>
                    </div>
                    <input
                      type="checkbox"
                      checked={Boolean(editForm.isAdult)}
                      onChange={(e) => setEditForm((p) => ({ ...p, isAdult: e.target.checked }))}
                      className="w-5 h-5 accent-rose-500 cursor-pointer"
                    />
                  </label>
                  <label className="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs cursor-pointer">
                    <div>
                      <div className="font-extrabold text-amber-300">👑 관리자 계정 권한</div>
                      <div className="text-[10px] text-slate-400">
                        {String(editForm.nickname || '').trim() === '랜선판다'
                          ? '랜선판다 계정은 항상 관리자로 고정됩니다.'
                          : '체크 시 비밀번호 없이 관리자 모드 및 낚시 대회 개최가 가능합니다.'}
                      </div>
                    </div>
                    <input
                      type="checkbox"
                      disabled={String(editForm.nickname || '').trim() === '랜선판다'}
                      checked={Boolean(editForm.isAdmin) || String(editForm.nickname || '').trim() === '랜선판다'}
                      onChange={(e) => setEditForm((p) => ({ ...p, isAdmin: e.target.checked }))}
                      className="w-5 h-5 accent-amber-400 cursor-pointer"
                    />
                  </label>

                  <div className="p-3 rounded-2xl bg-[#080c17] border border-[#232f52] space-y-2">
                    <div className="font-extrabold text-slate-300">📊 게임별 누적 전적 수정</div>
                    <div className="grid grid-cols-2 gap-2">
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">🔮 마블 참가</span>
                        <input type="number" min={0} value={editForm.marblePlays} onChange={(e) => setEditForm((p) => ({ ...p, marblePlays: e.target.value }))} className="w-16 bg-transparent text-right font-black text-white outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">🔮 마블 1등</span>
                        <input type="number" min={0} value={editForm.marbleWins} onChange={(e) => setEditForm((p) => ({ ...p, marbleWins: e.target.value }))} className="w-16 bg-transparent text-right font-black text-amber-300 outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">⭕ OX 우승</span>
                        <input type="number" min={0} value={editForm.oxWins} onChange={(e) => setEditForm((p) => ({ ...p, oxWins: e.target.value }))} className="w-16 bg-transparent text-right font-black text-amber-300 outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">⭕ OX 정답수</span>
                        <input type="number" min={0} value={editForm.oxCorrect} onChange={(e) => setEditForm((p) => ({ ...p, oxCorrect: e.target.value }))} className="w-16 bg-transparent text-right font-black text-emerald-300 outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">🕹️ 미니게임 판수</span>
                        <input type="number" min={0} value={editForm.mgPlays} onChange={(e) => setEditForm((p) => ({ ...p, mgPlays: e.target.value }))} className="w-16 bg-transparent text-right font-black text-white outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">🕹️ 미니게임 승</span>
                        <input type="number" min={0} value={editForm.mgWins} onChange={(e) => setEditForm((p) => ({ ...p, mgWins: e.target.value }))} className="w-16 bg-transparent text-right font-black text-amber-300 outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">🏇 경마 우승</span>
                        <input type="number" min={0} value={editForm.hrWins} onChange={(e) => setEditForm((p) => ({ ...p, hrWins: e.target.value }))} className="w-16 bg-transparent text-right font-black text-amber-300 outline-none" />
                      </div>
                      <div className="flex items-center justify-between bg-[#111625] rounded-lg px-2.5 py-1.5">
                        <span className="text-[11px] text-slate-400">🃏 블랙잭 승</span>
                        <input type="number" min={0} value={editForm.bjWins} onChange={(e) => setEditForm((p) => ({ ...p, bjWins: e.target.value }))} className="w-16 bg-transparent text-right font-black text-amber-300 outline-none" />
                      </div>
                    </div>
                  </div>

                  {editUserError && <p className="text-xs font-bold text-rose-400 text-center">{editUserError}</p>}

                  <div className="grid grid-cols-2 gap-2.5 pt-1">
                    <button
                      type="button"
                      onClick={() => setEditingUser(null)}
                      className="py-2.5 rounded-xl bg-[#252d3d] hover:bg-[#303a4f] text-slate-200 font-extrabold text-xs"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-lg"
                    >
                      💾 저장하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= 관리자 비밀번호 입력 모달 ================= */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center px-4">
              <div className="w-full max-w-[350px] bg-[#131829] border border-[#242e4c] rounded-[22px] p-6 shadow-2xl">
                <h3 className="text-base sm:text-[17px] font-extrabold text-white mb-4">
                  관리자 비밀번호 입력
                </h3>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <input
                      type="password"
                      inputMode="numeric"
                      maxLength={12}
                      value={adminPw}
                      onChange={(e) => setAdminPw(e.target.value)}
                      placeholder="비밀번호"
                      autoFocus
                      className="w-full bg-[#060913] border border-[#4c49b8] focus:border-[#635bff] rounded-xl px-4 py-3.5 text-center text-base font-bold text-white placeholder-slate-400 outline-none"
                    />
                    {adminError && (
                      <p className="text-xs font-bold text-rose-400 text-center mt-2">
                        비밀번호가 일치하지 않습니다.
                      </p>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowAdminModal(false)}
                      className="py-3 rounded-xl bg-[#252d3d] hover:bg-[#303a4f] text-slate-200 font-extrabold text-sm"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="py-3 rounded-xl bg-[#5851f6] hover:bg-[#4b44e6] text-white font-extrabold text-sm shadow-lg"
                    >
                      확인
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
